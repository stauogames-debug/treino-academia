<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treino da Semana</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 16px 10px;
    background: #E7ECF1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    color: #16222E;
    background: #F4F6F8;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #D8E0E8;
  }
  .hdr {
    background: #12314F;
    color: #fff;
    padding: 16px 18px 14px;
  }
  .hdr h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .hdr p { margin: 3px 0 0; font-size: 12.5px; color: #A9C1D6; }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 10px 0;
    background: #12314F;
    overflow-x: auto;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: #A9C1D6;
    background: #0E2740;
    border: none;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
  }
  .tab.active { background: #F4F6F8; color: #12314F; }
  .datebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: #FFF6DE;
    border-bottom: 1px solid #E9D9A6;
  }
  .datebar label { font-size: 12.5px; font-weight: 600; color: #7A5E00; }
  .datebar input[type=date] {
    border: 1px solid #E0C568;
    background: #fff;
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 13px;
    color: #16222E;
  }
  .body { padding: 12px 14px 18px; }
  .exercise {
    background: #fff;
    border: 1px solid #DCE4EC;
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .ex-head {
    background: #EAF2FA;
    padding: 9px 12px;
    font-weight: 700;
    font-size: 13.5px;
    color: #0C447C;
    border-bottom: 1px solid #DCE4EC;
  }
  .ex-ref {
    font-size: 11px;
    font-weight: 400;
    color: #5B7A94;
    margin-top: 2px;
  }
  .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid #F0F3F6;
  }
  .set-row:last-child { border-bottom: none; }
  .set-tag {
    flex: 0 0 44px;
    font-size: 11.5px;
    font-weight: 700;
    color: #5B6B7A;
    text-align: center;
    background: #F0F3F6;
    border-radius: 6px;
    padding: 3px 0;
  }
  .set-reps {
    flex: 1 1 auto;
    font-size: 12.5px;
    color: #16222E;
  }
  .set-reps small { display: block; font-size: 10.5px; color: #8B98A5; }
  .set-input-wrap { flex: 0 0 92px; position: relative; }
  .set-input {
    width: 100%;
    border: 1px solid #E0C568;
    background: #FFF6DE;
    border-radius: 7px;
    padding: 7px 26px 7px 8px;
    font-size: 14px;
    font-weight: 600;
    color: #16222E;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .set-input::placeholder { color: #B8AA79; font-weight: 400; }
  .set-unit {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #9A8A4A;
    pointer-events: none;
  }
  .toast {
    position: sticky;
    bottom: 8px;
    text-align: center;
    font-size: 11.5px;
    color: #0F6E56;
    height: 16px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
  .hint {
    font-size: 10.5px;
    color: #8B98A5;
    padding: 0 4px 6px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var DAYS = [
    { slug: "seg", label: "Seg", full: "Segunda - Push", exercises: [
      { name: "Desenvolvimento com halteres", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Crucifixo reto na máquina", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Elevação lateral", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Supino inclinado", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Tríceps francês", sets: ["15","8","6 a 8"] },
      { name: "Elevação frontal", sets: ["10","8","8"] },
      { name: "Tríceps pulley", sets: ["10","8","8"] }
    ]},
    { slug: "ter", label: "Ter", full: "Terça - Pull", exercises: [
      { name: "Bíceps no banco scott", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Puxada alta com barra H", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Bíceps rosca direta no banco inclinado", sets: ["10","8","6 a 8"] },
      { name: "Remada na máquina (pegada aberta)", sets: ["10","8","6 a 8"] },
      { name: "Bíceps martelo com corda na polia", sets: ["8","6 a 8"] },
      { name: "Pull down", sets: ["8","6 a 8"] }
    ]},
    { slug: "qua", label: "Qua", full: "Quarta - Legs", exercises: [
      { name: "Cadeira extensora", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Cadeira flexora", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Agachamento no smith", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Cadeira abdutora", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Leg press", sets: ["8"] },
      { name: "Panturrilha no leg", sets: ["10","8","6 a 8","6 a 8"] }
    ]},
    { slug: "qui", label: "Qui", full: "Quinta - Upper", exercises: [
      { name: "Bíceps martelo", sets: ["15","10","8","6 a 8","6 a 8"], ref: "Referência: 21-27-33-39kg" },
      { name: "Remada cavalinho na máquina", sets: ["15","10","8","6 a 8","6 a 8"], ref: "Referência: 15-25-30-35kg" },
      { name: "Bíceps unilateral na polia", sets: ["10","8","6 a 8","6 a 8"], ref: "Referência: 9-15-18kg" },
      { name: "Supino reto", sets: ["10","8","6 a 8","6 a 8"], ref: "Referência: 10-15-17kg" },
      { name: "Tríceps na paralela", sets: ["10","6 a 8","6 a 8"], ref: "Referência: 3-3-4 reps" },
      { name: "Elevação lateral", sets: ["10","6 a 10","6 a 10"], ref: "Referência: 7-9kg" },
      { name: "Desenvolvimento na máquina", sets: ["10","6 a 10","6 a 10"], ref: "Referência: 10-15kg" }
    ]},
    { slug: "sex", label: "Sex", full: "Sexta - Lower", exercises: [
      { name: "Cadeira flexora", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Cadeira extensora", sets: ["15","10","8","6 a 8","6 a 8"] },
      { name: "Stiff", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Cadeira adutora", sets: ["10","8","6 a 8","6 a 8"] },
      { name: "Mesa flexora", sets: ["10","6 a 8"] },
      { name: "Panturrilha no smith", sets: ["10","8","6 a 8","6 a 8"] }
    ]}
  ];

  var state = { day: 0, date: new Date().toISOString().slice(0,10), history: {} };
  var app = document.getElementById("app");

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function storageGet(key){
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        return window.storage.get(key, false);
      }
    } catch(e){}
    var v = null;
    try { v = localStorage.getItem(key); } catch(e){}
    return Promise.resolve(v ? { value: v } : null);
  }

  function storageSet(key, value){
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        return window.storage.set(key, value, false);
      }
    } catch(e){}
    try { localStorage.setItem(key, value); } catch(e){}
    return Promise.resolve(true);
  }

  function loadDayHistory(slug, cb){
    storageGet("treino:" + slug).then(function(res){
      cb(res && res.value ? JSON.parse(res.value) : {});
    }).catch(function(){ cb({}); });
  }

  function lastEntryBefore(arr, dateExcl){
    if(!arr || !arr.length) return null;
    var sorted = arr.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    for(var i=0;i<sorted.length;i++){
      if(sorted[i].date !== dateExcl) return sorted[i];
    }
    return sorted[0].date === dateExcl ? null : sorted[0];
  }

  function entryForDate(arr, date){
    if(!arr) return null;
    for(var i=0;i<arr.length;i++){ if(arr[i].date === date) return arr[i]; }
    return null;
  }

  function upsertEntry(arr, date, weight){
    arr = arr || [];
    for(var i=0;i<arr.length;i++){
      if(arr[i].date === date){ arr[i].weight = weight; return arr; }
    }
    arr.push({ date: date, weight: weight });
    if(arr.length > 30) arr = arr.slice(arr.length - 30);
    return arr;
  }

  function render(){
    var day = DAYS[state.day];
    var html = '';
    html += '<div class="hdr"><h1>Treino da semana</h1><p>' + day.full + '</p></div>';
    html += '<div class="tabs">';
    DAYS.forEach(function(d, i){
      html += '<button class="tab' + (i===state.day?' active':'') + '" data-day="'+i+'">' + d.label + '</button>';
    });
    html += '</div>';
    html += '<div class="datebar"><label for="dt">Data do treino</label><input type="date" id="dt" value="'+state.date+'"></div>';
    html += '<div class="body" id="body"></div>';
    html += '<div class="toast" id="toast">Salvo</div>';
    app.innerHTML = html;

    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.day = parseInt(this.getAttribute('data-day'), 10);
        render();
      });
    });
    document.getElementById('dt').addEventListener('change', function(){
      state.date = this.value || todayStr();
      renderBody();
    });

    loadDayHistory(day.slug, function(hist){
      state.history[day.slug] = hist;
      renderBody();
    });
  }

  function renderBody(){
    var day = DAYS[state.day];
    var hist = state.history[day.slug] || {};
    var body = document.getElementById('body');
    if(!body) return;
    var html = '<div class="hint">Toque no campo amarelo e anote a carga (kg) de cada série.</div>';
    day.exercises.forEach(function(ex, exIdx){
      html += '<div class="exercise">';
      html += '<div class="ex-head">' + ex.name + (ex.ref ? '<div class="ex-ref">' + ex.ref + '</div>' : '') + '</div>';
      ex.sets.forEach(function(reps, setIdx){
        var key = exIdx + '_' + setIdx;
        var arr = hist[key] || [];
        var current = entryForDate(arr, state.date);
        var prev = lastEntryBefore(arr, state.date);
        var placeholder = prev ? (prev.weight + ' kg') : '—';
        var val = current ? current.weight : '';
        html += '<div class="set-row">';
        html += '<div class="set-tag">S' + (setIdx+1) + '</div>';
        html += '<div class="set-reps">' + reps + ' reps' + (prev ? '<small>última: ' + prev.weight + 'kg (' + prev.date.slice(5) + ')</small>' : '') + '</div>';
        html += '<div class="set-input-wrap"><input class="set-input" inputmode="decimal" data-key="' + key + '" placeholder="' + placeholder + '" value="' + val + '"><span class="set-unit">kg</span></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    body.innerHTML = html;

    document.querySelectorAll('.set-input').forEach(function(inp){
      inp.addEventListener('change', function(){
        var key = this.getAttribute('data-key');
        var raw = this.value.replace(',', '.').trim();
        var day2 = DAYS[state.day];
        var hist2 = state.history[day2.slug] || {};
        if(raw === ''){
          if(hist2[key]){
            hist2[key] = hist2[key].filter(function(e){ return e.date !== state.date; });
          }
        } else {
          var w = parseFloat(raw);
          if(isNaN(w)) return;
          hist2[key] = upsertEntry(hist2[key], state.date, w);
        }
        state.history[day2.slug] = hist2;
        storageSet("treino:" + day2.slug, JSON.stringify(hist2)).then(function(){
          var toast = document.getElementById('toast');
          if(toast){
            toast.classList.add('show');
            setTimeout(function(){ toast.classList.remove('show'); }, 1200);
          }
        }).catch(function(){});
      });
    });
  }

  render();
})();
</script>
</body>
</html>
